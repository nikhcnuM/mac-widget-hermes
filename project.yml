name: MacWidgetBoilerplate
options:
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    CODE_SIGN_STYLE: Automatic
    APP_GROUP_ID: group.com.example.macwidgetboilerplate

targets:
  MacWidgetBoilerplateApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: WidgetTemplate/App
      - path: WidgetTemplate/Shared
    settings:
      base:
        PRODUCT_NAME: MacWidgetBoilerplate
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MacWidgetBoilerplate
        INFOPLIST_FILE: WidgetTemplate/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: WidgetTemplate/App/App.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: MacWidgetBoilerplateWidget
        embed: true

  MacWidgetBoilerplateWidget:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: WidgetTemplate/Widget
      - path: WidgetTemplate/Shared
    settings:
      base:
        PRODUCT_NAME: MacWidgetBoilerplateWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MacWidgetBoilerplate.Widget
        INFOPLIST_FILE: WidgetTemplate/Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: WidgetTemplate/Widget/Widget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  MacWidgetBoilerplate:
    build:
      targets:
        MacWidgetBoilerplateApp: all
